name: Sela CI

on:
  push:
    branches: [feat/sela-prd-v1]
  pull_request:
    branches: [feat/sela-prd-v1]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: Build
        run: npm run build
