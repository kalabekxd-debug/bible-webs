<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verse & Sky — a Bible verse for how you feel</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky-stage">
    <div class="rays-wrap"><div class="rays"></div></div>
    <div class="sun"></div>
    <div class="clouds"></div>
    <div class="wrap">
      <div class="top-space"></div>
      <div style="text-align:center;"><span class="eyebrow">Verse &amp; Sky</span></div>
      <h1 class="title">A word for however<br>you feel today</h1>
      <p class="subtitle">Choose the feeling that's closest to your heart right now, and receive a Bible verse held gently for that moment.</p>
      <div class="grid" id="emotion-grid" role="list" aria-label="Choose an emotion"></div>
    </div>
  </div>
  <footer>Every verse is from the King James Bible. Take a slow breath before you choose. 🕊️</footer>
  <script src="data.js"></script>
  <script>
    const grid = document.getElementById('emotion-grid');
    EMOTIONS.forEach(e => {
      const a = document.createElement('a');
      a.href = `emotion.html?e=${e.id}`;
      a.className = 'feel-btn';
      a.style.setProperty('--btn-bg', e.bg);
      a.style.setProperty('--btn-ink', e.ink);
      a.setAttribute('role', 'listitem');
      a.innerHTML = `<span class="feel-emoji" aria-hidden="true">${e.emoji}</span><span>${e.label}</span><span class="feel-sub">Get a verse →</span>`;
      grid.appendChild(a);
    });
  </script>
</body>
</html>
